<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>User List</h1>
  <ul>
    {% for user in users %}
      <li>{{ user.name }} (ID: {{ user.id }})</li>
    {% endfor %}
  </ul>
</body>
</html>
