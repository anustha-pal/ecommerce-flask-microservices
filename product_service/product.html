<!DOCTYPE html>
<html>
<head>
  <title>Products</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Product Catalog</h1>
  <div class="product-list">
    {% for product in products %}
      <div class="product">
        <h3>{{ product.name }}</h3>
        <p>${{ product.price }}</p>
      </div>
    {% endfor %}
  </div>
</body>
</html>
